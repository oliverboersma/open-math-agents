# Trusted stage. Never checks out or runs PR code.
# Verdicts on finished checks are given by the merger (backlog.yml, tools/merger_loop.sh -> tools/verdict_one.sh),
# one long-running job instead of one queued job per proof. This workflow only reports pull requests that a person
# merged by hand (merges by the merger already credit the author themselves).
name: verdict
on:
  pull_request_target:
    types: [closed]
    paths: ["proofs/**", "reductions/**", "statements/**"]
permissions:
  contents: read
  pull-requests: read
  id-token: write  # an OIDC token proves to the site that a credit request comes from this workflow
jobs:
  credit:
    # A merged proof is the canonical acceptance: tell the site.
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
          sparse-checkout: tools/credit.sh
          sparse-checkout-cone-mode: false
      - name: Report to the desk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OMA_SITE: ${{ vars.OMA_SITE }}
          PR: ${{ github.event.pull_request.number }}
        run: bash base/tools/credit.sh "$PR"
